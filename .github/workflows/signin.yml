name: 米游社每日签到

on:
  schedule:
    # 定时使用 UTC，北京时间 = UTC + 8 小时
    # UTC 01:00 = 北京时间 09:00
    # 注意：GitHub 的 schedule 是尽力而为（best effort），高峰期可能延迟
    #       数分钟至数十分钟，不适合对分钟级精度有要求的场景
    - cron: '0 1 * * *'
  # 开启手动触发按钮，方便测试
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: pip install -r requirements.txt

      - name: 生成配置文件
        env:
          CONFIG_CONTENT: ${{ secrets.CONFIG_YAML }}
        run: |
          mkdir -p config
          printf '%s\n' "$CONFIG_CONTENT" > config/config.yaml

      - name: 执行签到任务
        run: python main.py
      # 注意：config/config.yaml 含 cookie 与 stoken，本仓库为公开仓库，
      # 禁止 cat/echo 该文件内容，否则凭证会写入公开可见的 Actions 日志
      - name: 检查配置文件（仅列目录，不输出内容）
        run: |
          ls -la config/
